name: Deploy metrics dashboard

on:
  push:
    branches:
      - watertowel21-github-metrics-dashboard
      - main
    paths:
      - 'react-practice/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: react-practice/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        working-directory: react-practice
        env:
          NPM_CONFIG_AUDIT: "false"
      - name: Lint
        run: npm run lint
        working-directory: react-practice
      - name: Test
        run: npm test -- --watchAll=false --runInBand
        working-directory: react-practice
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-practice/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        working-directory: react-practice
      - name: Build dashboard
        run: npm run build
        working-directory: react-practice
        env:
          CI: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: react-practice/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
