name: Deploy metrics dashboard

on:
  pull_request:
    paths:
      - 'react-practice/**'
      - '.github/actions/**'
      - '.github/workflows/**'
  push:
    branches:
      - watertowel21-github-metrics-dashboard
      - main
    paths:
      - 'react-practice/**'
      - '.github/actions/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  changes:
    name: Detect dashboard changes
    runs-on: ubuntu-latest
    outputs:
      dashboard: ${{ steps.filter.outputs.dashboard }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            dashboard:
              - 'react-practice/**'
              - '.github/actions/**'
              - '.github/workflows/**'

  quality:
    name: Reusable quality matrix
    needs: changes
    uses: ./.github/workflows/reusable-node-quality.yml
    with:
      node-versions: '["18.x", "20.x"]'
    secrets: inherit

  build:
    name: Build dashboard artifact
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js with cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-practice/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        working-directory: react-practice
        env:
          NPM_CONFIG_AUDIT: "false"
      - name: Build dashboard
        run: npm run build
        working-directory: react-practice
        env:
          CI: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: react-practice/build

  deploy:
    name: Deploy changed dashboard
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.dashboard == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs:
      - changes
      - build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
